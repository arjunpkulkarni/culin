[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning
markers =
    unit: Unit tests (fast, no external deps).
    integration: Integration tests (may need DB, artifacts, or env).
    slow: Slow tests (e.g. full pipeline).
