    NEXT_PUBLIC_COGNITO_CLIENT_ID: 4kjhqpg1b2u389rljtcdpn85kg
    NEXT_PUBLIC_AWS_REGION: us-east-1    
    APP_BASE_URL: https://api.recipe-gen.culin.ai/
